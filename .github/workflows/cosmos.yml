name: Regenerate cosmos

on:
  schedule:
    - cron: "17 6 * * *"   # daily, 06:17 UTC
  workflow_dispatch:
  push:
    paths:
      - "scripts/**"
      - ".github/workflows/cosmos.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build universe (README + all SVGs)
        env:
          # GraphQL contributions need a token. GITHUB_TOKEN covers public data;
          # add a COSMOS_TOKEN secret (PAT, read:user) to count private contributions.
          GITHUB_TOKEN: ${{ secrets.COSMOS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python scripts/universe.py --user "${{ github.repository_owner }}"

      - name: Commit if changed
        run: |
          git config user.name  "cosmos-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets
          git diff --cached --quiet || git commit -m "cosmos: refresh $(date -u +%F)"
          git push
