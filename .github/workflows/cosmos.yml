name: Regenerate cosmos

on:
  schedule:
    - cron: "17 6 * * *"   # daily, 06:17 UTC
  workflow_dispatch:
  push:
    paths:
      - "scripts/generate_cosmos.py"
      - ".github/workflows/cosmos.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate SVG
        env:
          # GraphQL contributions need a token. GITHUB_TOKEN works for public data;
          # set a PAT secret named COSMOS_TOKEN (read:user) to include private contributions.
          GITHUB_TOKEN: ${{ secrets.COSMOS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python scripts/generate_cosmos.py --user "${{ github.repository_owner }}" --out assets/cosmos.svg

      - name: Commit if changed
        run: |
          git config user.name  "cosmos-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/cosmos.svg
          git diff --cached --quiet || git commit -m "cosmos: refresh $(date -u +%F)"
          git push
